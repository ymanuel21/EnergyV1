<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="200" cy="150" r="60" fill="url(#sun)" opacity="0.9"/>
  <g stroke="#F59E0B" stroke-width="3" opacity="0.4">
    <line x1="200" y1="60" x2="200" y2="30"/><line x1="200" y1="240" x2="200" y2="270"/>
    <line x1="110" y1="150" x2="80" y2="150"/><line x1="290" y1="150" x2="320" y2="150"/>
    <line x1="136" y1="86" x2="115" y2="65"/><line x1="264" y1="214" x2="285" y2="235"/>
    <line x1="264" y1="86" x2="285" y2="65"/><line x1="136" y1="214" x2="115" y2="235"/>
  </g>
  <!-- House -->
  <rect x="500" y="350" width="280" height="200" rx="4" fill="#1E293B"/>
  <polygon points="480,350 780,350 640,220" fill="#334155"/>
  <rect x="530" y="230" width="220" height="120" rx="2" fill="#3B82F6" opacity="0.8"/>
  <g stroke="#60A5FA" stroke-width="1">
    <line x1="530" y1="290" x2="750" y2="290"/><line x1="530" y1="350" x2="750" y2="350"/>
    <line x1="585" y1="230" x2="585" y2="350"/><line x1="640" y1="230" x2="640" y2="350"/>
    <line x1="695" y1="230" x2="695" y2="350"/>
  </g>
  <!-- Solar panels on roof -->
  <rect x="555" y="240" width="170" height="90" rx="3" fill="#1E40AF" opacity="0.9"/>
  <g stroke="#3B82F6" stroke-width="0.5">
    <line x1="555" y1="270" x2="725" y2="270"/><line x1="555" y1="300" x2="725" y2="300"/>
    <line x1="585" y1="240" x2="585" y2="330"/><line x1="615" y1="240" x2="615" y2="330"/>
    <line x1="645" y1="240" x2="645" y2="330"/><line x1="675" y1="240" x2="675" y2="330"/>
    <line x1="705" y1="240" x2="705" y2="330"/>
  </g>
  <!-- Text -->
  <text x="800" y="650" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#1E293B">Solar Rooftop Installation</text>
  <text x="800" y="700" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#64748B">Residential · Rooftop Solar PV</text>
  <!-- EBTPlaza tag -->
  <rect x="720" y="750" width="160" height="36" rx="18" fill="#2563EB" opacity="0.9"/>
  <text x="800" y="774" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">EBTPlaza Project</text>
  <text x="800" y="830" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Professional photography coming soon</text>
</svg>
